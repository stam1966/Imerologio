<!doctype html><html lang="el"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Πρόγραμμα Δράσεων Σχολείου</title>
<link rel="icon" href="/logo.png">
<style>
:root{--brand:#2F6F73;--brand-600:#265B5E;--brand-700:#1F4A4C;--brand-50:#EEF6F5;--brand-100:#D8EBE8;--gold:#D4A017;--gold-50:#FFF6DB;
 --bg:#F5F6F4;--surface:#FFFFFF;--line:#E3E8E6;--line2:#EEF1F0;--text:#1F2A2E;--muted:#65727A;--faint:#98A3A8;
 --ok:#2F7D3F;--ok-50:#E7F4E9;--warn:#8A6100;--warn-50:#FFF4D6;--danger:#B8382A;--danger-50:#FCEAE7;--int:#8A4B00;--int-50:#FFEFDC;--focus:#2563EB;
 --r:12px;--r-sm:8px;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);--sh-lg:0 12px 32px rgba(16,24,40,.16);
 --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%}body{margin:0;font:14px/1.5 var(--font);color:var(--text);background:var(--bg);overflow:hidden;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app{display:grid;grid-template-columns:240px 1fr;height:100vh}
/* ---- πλευρική στήλη ---- */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;gap:11px;align-items:center;padding:16px 16px 12px}.brand img{width:42px;height:42px;border-radius:12px;background:var(--brand-50)}
.brand b{display:block;font-size:14px;line-height:1.25;font-weight:650}.brand .yr{margin-top:3px;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:20px;padding:0 9px 0 10px;font-size:12px;color:var(--brand);font-weight:600;background:var(--brand-50);cursor:pointer;white-space:nowrap}
.brand .yr:hover{border-color:var(--brand-100)}
.nav{list-style:none;margin:6px 0;padding:0 10px;flex:1;overflow:auto}.nav li{margin:1px 0}
.nav button{display:flex;gap:11px;align-items:center;width:100%;border:0;background:none;color:#3D4A50;padding:9px 11px;border-radius:9px;cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{background:#F2F5F4}.nav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav button.on{background:var(--brand-50);color:var(--brand-700);font-weight:650}.nav button.on svg{color:var(--brand)}
.nav .cnt{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--gold-50);color:var(--warn);border-radius:10px;padding:0 7px}
.nav .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700;padding:14px 11px 4px}
.foot{padding:10px 14px 14px;border-top:1px solid var(--line);display:grid;gap:8px}
.foot .row2{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
.newver{border:0;background:var(--gold);color:#3A2C00;border-radius:9px;padding:8px 10px;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center}
.linkbtn{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 4px;border-radius:6px}.linkbtn:hover{color:var(--danger);background:var(--danger-50)}
/* ---- κορυφή ---- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:14px;padding:14px 26px;background:var(--bg)}
.top h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}.top .sub{color:var(--muted);font-size:13px}
.gsearch{margin-left:auto;position:relative}.gsearch input[type=search]{width:290px;padding:8px 12px 8px 36px;border-radius:10px;border:1px solid var(--line);background:#fff}
.gsearch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.content{flex:1;overflow:auto;padding:4px 26px 90px;min-height:0}.wrap{max-width:1280px}
/* ---- στοιχεία ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:var(--r-sm);padding:7px 14px;cursor:pointer;white-space:nowrap;font-weight:600;color:#33403F;box-shadow:0 1px 1px rgba(16,24,40,.04)}
.btn:hover:not(:disabled){background:#F4F7F6;border-color:#D5DDDA}.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover:not(:disabled){background:var(--brand-600)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.ok:hover:not(:disabled){background:#286A35}
.btn.danger{color:var(--danger)}.btn.danger:hover:not(:disabled){background:var(--danger-50);border-color:#F0C7C0}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}.btn.ghost:hover:not(:disabled){background:#EDF1F0}
.btn.sm{padding:4px 10px;font-size:12.5px}.btn.lg{padding:10px 18px;font-size:15px}.btn.icon{padding:6px;width:34px;height:34px}
input[type=text],input[type=search],input[type=password],input[type=date],input[type=time],input[type=number],input:not([type]),select,textarea{border:1px solid #D3DBD8;border-radius:var(--r-sm);padding:7px 10px;background:#fff;max-width:100%;min-height:36px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px #2F6F7326}
textarea{resize:vertical;width:100%;line-height:1.5}input[type=checkbox],input[type=radio]{width:17px;height:17px;accent-color:var(--brand);margin:0;vertical-align:-3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);margin-bottom:16px}
.card h2{font-size:16px;font-weight:700;margin:0 0 4px}.card h3{font-size:14px;font-weight:700;margin:18px 0 6px}.card .desc{color:var(--muted);margin:0 0 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.right{margin-left:auto}.muted{color:var(--muted)}.small{font-size:12.5px}.b{font-weight:650}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}.grid2>.card{margin:0}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field>span{font-size:12.5px;color:#46545A;font-weight:600}.field input,.field select,.field textarea{width:100%}
.hint{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:650;white-space:nowrap;border:0}
.s0{background:var(--warn-50);color:var(--warn)}.s1{background:var(--ok-50);color:var(--ok)}.s2{background:var(--danger-50);color:var(--danger)}.s3{background:#EDF0F3;color:#4B5865}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
button.pill{cursor:pointer}button.pill:hover{filter:brightness(.96)}
.cat{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#3D4A50;white-space:nowrap}.cat i{width:9px;height:9px;border-radius:3px;display:inline-block;flex-shrink:0}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:6px;padding:0 7px}.tag.int{background:var(--int-50);color:var(--int)}.tag.ms{background:var(--gold-50);color:var(--warn)}
.note{border-radius:10px;padding:10px 14px;margin:10px 0;background:var(--brand-50);border:1px solid var(--brand-100)}.note.warn{background:var(--warn-50);border-color:#F2DE9E}.note.bad{background:var(--danger-50);border-color:#F0C7C0}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}.empty svg{width:42px;height:42px;color:var(--faint);stroke-width:1.4}.empty b{display:block;color:var(--text);font-size:15px;margin:8px 0 4px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11.5px;background:#fff;font-family:inherit}
/* καρτέλες / segmented */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:7px;align-items:center}
.tabs button:hover{color:var(--text)}.tabs button.on{color:var(--brand-700);border-bottom-color:var(--brand)}.tabs .n{font-size:11.5px;background:#EDF1F0;color:var(--muted);border-radius:10px;padding:0 7px}.tabs button.on .n{background:var(--brand-50);color:var(--brand)}
.seg{display:inline-flex;background:#EAEEED;border-radius:10px;padding:3px;flex-wrap:wrap}.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.seg button.on{background:#fff;color:var(--text);box-shadow:var(--sh)}
/* διακόπτης */
.sw{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line2);cursor:pointer}.sw:last-child{border-bottom:0}.sw .t{flex:1}.sw .t b{display:block;font-weight:600}.sw .t small{color:var(--muted)}
.sw input{appearance:none;width:38px;height:22px;border-radius:12px;background:#CBD3D0;position:relative;cursor:pointer;flex-shrink:0;transition:background .15s;margin-top:2px}
.sw input::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s;box-shadow:0 1px 2px #0003}
.sw input:checked{background:var(--brand)}.sw input:checked::after{left:18px}.sw input:disabled{opacity:.5}
/* λίστα δράσεων */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.fpanel{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;box-shadow:var(--sh)}.fpanel .field{margin:0;min-width:180px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chips:empty{display:none}.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 6px 3px 11px;font-size:12.5px}
.chip button{border:0;background:#EDF1F0;border-radius:50%;width:18px;height:18px;line-height:16px;cursor:pointer;color:var(--muted);padding:0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.mh{display:flex;align-items:center;gap:8px;padding:9px 16px;background:#F8FAF9;border-bottom:1px solid var(--line);font-weight:700;color:var(--brand-700);position:sticky;top:0;z-index:2}.mh small{color:var(--muted);font-weight:500}
.it{display:grid;grid-template-columns:26px 54px 1fr auto auto 34px;gap:12px;align-items:center;padding:10px 12px 10px 14px;border-bottom:1px solid var(--line2);cursor:pointer;position:relative}
.it:last-child{border-bottom:0}.it:hover{background:#FAFCFB}.it.sel{background:#FFF9E6}.it.done .tt{color:#4E5B60}.it.cancel .tt{text-decoration:line-through;color:var(--faint)}
.it::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;background:var(--c,#ccc)}
.it .ck{opacity:.35}.it:hover .ck,.it .ck:checked,.anysel .it .ck{opacity:1}
.dbox{text-align:center;line-height:1.1;border-radius:10px;padding:5px 0;background:#F2F5F4}.dbox b{display:block;font-size:18px}.dbox small{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase}.dbox.today{background:var(--brand);color:#fff}.dbox.today small{color:#D6ECE9}
.tt{font-weight:650;line-height:1.3}.mt{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:3px}.mt span{display:inline-flex;gap:4px;align-items:center}.mt svg{width:14px;height:14px}
.calst{width:24px;text-align:center;font-size:15px}
.more{border:0;background:none;border-radius:8px;width:32px;height:32px;cursor:pointer;color:var(--muted)}.more:hover{background:#EDF1F0;color:var(--text)}
.count{color:var(--muted);font-size:12.5px;padding:10px 2px}
/* μήνας */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.calhead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}.calhead b{font-size:16px;min-width:160px;text-align:center}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.calgrid .dow{background:#F8FAF9;font-size:12px;font-weight:700;color:var(--muted);padding:6px 9px;border-bottom:1px solid var(--line)}
.day{min-height:112px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:5px 6px;position:relative}.day:nth-child(7n){border-right:0}
.day.out{background:#FAFBFA}.day.out .dn{color:#C2CAC7}.day.we{background:#FCFCFA}
.day .dn{font-size:12.5px;font-weight:700;color:var(--muted);display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:12px;margin-bottom:3px}.day.today .dn{background:var(--brand);color:#fff}
.day .add{position:absolute;right:5px;top:4px;border:0;background:var(--brand-50);color:var(--brand);border-radius:6px;width:22px;height:22px;font-weight:700;cursor:pointer;opacity:0}.day:hover .add{opacity:1}
.ev{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;width:100%;text-align:left;border:0;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);border-radius:5px;padding:2px 6px;margin-bottom:3px;font-size:12px;line-height:1.3;cursor:pointer;overflow:hidden}
.ev.s1{opacity:.75}.ev.s2{text-decoration:line-through;opacity:.6}.ev.gd{border-left:2px dashed #B7C0BD;background:#fff;color:var(--muted);font-style:italic}.ev:hover{filter:brightness(.97)}.ev.sel{outline:2px solid var(--gold)}
/* αρχική */
.hello{display:flex;align-items:center;gap:18px;margin-bottom:18px}.hello h2{font-size:24px;margin:0;font-weight:700;letter-spacing:-.01em}.hello p{margin:2px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);cursor:pointer;text-align:left;display:flex;gap:12px;align-items:center}.stat:hover{border-color:#CBD7D3}
.stat .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center}.stat b{display:block;font-size:24px;line-height:1.1}.stat span{font-size:12.5px;color:var(--muted)}
.home{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:16px}
.tl .it{grid-template-columns:54px 1fr auto}
.att{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}.att:last-child{border-bottom:0}.att .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px}.qa .btn{justify-content:flex-start;padding:10px 12px}
.steps{display:grid;gap:10px;counter-reset:s}.steps>div{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;flex-wrap:wrap}
.steps>div::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--brand-50);color:var(--brand);font-weight:700;display:grid;place-items:center;flex-shrink:0}
/* κάρτες επιλογής */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{border:1.5px solid var(--line);background:#fff;border-radius:var(--r);padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh);position:relative}
.tile:hover{border-color:#B9CFCB}.tile.on{border-color:var(--brand);background:var(--brand-50);box-shadow:0 0 0 3px #2F6F7320}.tile .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--brand-50);color:var(--brand)}
.tile.on .ic{background:#fff}.tile b{font-size:14.5px}.tile span{font-size:12.5px;color:var(--muted)}.tile .rec{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;color:var(--ok);background:var(--ok-50);border-radius:6px;padding:0 6px}
.radios{display:grid;gap:8px}.radios label{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff;flex-wrap:wrap}.radios label.on{border-color:var(--brand);background:var(--brand-50)}
/* συρτάρι λεπτομερειών */
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:#fff;box-shadow:var(--sh-lg);transform:translateX(105%);transition:transform .18s ease;z-index:40;display:flex;flex-direction:column}
.drawer.open{transform:none}.drawer .dh{padding:16px 20px 14px;border-bottom:1px solid var(--line);border-top:5px solid var(--c,#ccc)}.drawer .db{padding:16px 20px;overflow:auto;flex:1}.drawer .df{padding:14px 20px;border-top:1px solid var(--line);display:grid;gap:8px}
.drawer h2{margin:6px 0 8px;font-size:19px;line-height:1.3}.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:13.5px;margin:0 0 14px}.kv dt{color:var(--muted)}.kv dd{margin:0}
.drawer .descr{white-space:pre-wrap;background:#F8FAF9;border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
/* γραμμή επιλογής */
.selbar{position:fixed;left:calc(50% + 120px);bottom:22px;transform:translateX(-50%);background:#1F2A2E;color:#fff;border-radius:14px;padding:8px 10px 8px 16px;display:flex;gap:6px;align-items:center;box-shadow:var(--sh-lg);z-index:30;flex-wrap:wrap;max-width:94vw}
.selbar b{margin-right:8px}.selbar button{border:0;background:#ffffff14;color:#fff;border-radius:9px;padding:6px 11px;cursor:pointer;font-weight:600}.selbar button:hover{background:#ffffff28}.selbar button.dg{color:#FFB4A8}
/* μενού */
.menu{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh-lg);padding:5px;min-width:210px}.menu button{display:flex;gap:9px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:7px 10px;border-radius:7px;cursor:pointer;white-space:pre}
.menu button:hover{background:#F2F5F4}.menu button.dg{color:var(--danger)}.menu hr{border:0;border-top:1px solid var(--line2);margin:4px 0}
/* διάλογοι */
dialog{border:0;border-radius:16px;box-shadow:var(--sh-lg);padding:0;max-width:min(1000px,95vw);width:max-content;min-width:440px;max-height:92vh}
dialog::backdrop{background:#16202480}.dlg{display:flex;flex-direction:column;max-height:92vh}.dlg header{padding:18px 22px 6px;font-size:18px;font-weight:700}
.dlg .body{padding:6px 22px 14px;overflow:auto}.dlg footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 22px 16px;border-top:1px solid var(--line2);align-items:center}
.ttl-in{font-size:17px;font-weight:600;padding:10px 12px!important}
.catpick{display:flex;flex-wrap:wrap;gap:6px}.catpick button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px 4px 9px;cursor:pointer;display:flex;gap:7px;align-items:center;font-size:13px}
.catpick button i{width:10px;height:10px;border-radius:3px}.catpick button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);font-weight:650}
details.more2{border:1px solid var(--line);border-radius:10px;padding:0 14px;margin-top:6px}details.more2 summary{cursor:pointer;padding:10px 0;font-weight:600;color:#3D4A50}details.more2[open] summary{border-bottom:1px solid var(--line2);margin-bottom:6px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}.swatches button{width:26px;height:26px;border-radius:8px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}.swatches button.on{box-shadow:0 0 0 2px var(--text)}
.fsl{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;min-width:min(600px,80vw)}.fsl button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 12px;cursor:pointer}.fsl button:hover{background:var(--brand-50)}
/* λοιπά */
.toasts{position:fixed;left:calc(50% + 120px);transform:translateX(-50%);bottom:24px;display:flex;flex-direction:column;gap:8px;z-index:70;align-items:center}
.toast{background:#1F2A2E;color:#fff;border-radius:12px;padding:10px 12px 10px 16px;box-shadow:var(--sh-lg);max-width:560px;white-space:pre-line;display:flex;gap:14px;align-items:center}.toast.bad{background:var(--danger)}
.toast button{border:0;background:#ffffff1f;color:#fff;border-radius:8px;padding:5px 11px;font-weight:700;cursor:pointer}
.preview{width:100%;height:calc(100vh - 260px);min-height:460px;border:1px solid var(--line);border-radius:10px;background:#fff}

/* ---------------- επικοινωνία ---------------- */
async function api(path,data={}){let r;try{r=await fetch('/api/'+path,{method:'POST',headers:{'X-App-Token':token,'Content-Type':'application/json'},body:JSON.stringify(data)});}
 catch(e){throw Error('Η επικοινωνία με την εφαρμογή απέτυχε. Είναι ανοικτή;');}
 let j={};try{j=await r.json();}catch(e){}
 if(!r.ok){if(r.status===423&&S){S.lifelog.unlocked=false;if(page==='lifelog'&&path!=='lifelog/unlock')render();}throw Error(j.error||'Σφάλμα ('+r.status+').');}return j;}
async function call(path,data,done){try{const j=await api(path,data);if(done)toast(done);return j;}catch(e){toast(e.message,true);return null;}}

function toast(t,bad,action){const el=document.createElement('div');el.className='toast'+(bad?' bad':'');el.innerHTML=`<span>${esc(t)}</span>`;
 if(action){const b=document.createElement('button');b.textContent=action.label;b.onclick=()=>{el.remove();action.run();};el.append(b);}
 $('#toasts').append(el);setTimeout(()=>el.remove(),action?9000:bad?7000:3200);}
const b64toBlob=(b,m)=>{const s=atob(b),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new Blob([a],{type:m||'application/octet-stream'});};
async function saveFile(blob,name){
 if(window.showSaveFilePicker){try{const ext=name.split('.').pop();const h=await showSaveFilePicker({suggestedName:name,types:[{description:ext.toUpperCase(),accept:{[blob.type.split(';')[0]||'application/octet-stream']:['.'+ext]}}]});
  const w=await h.createWritable();await w.write(blob);await w.close();toast('Αποθηκεύτηκε: '+h.name);return true;}catch(e){if(e.name==='AbortError')return false;}}
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('Αποθηκεύτηκε στις Λήψεις: '+name);return true;}
const readFile=file=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result.split(',')[1]||'');fr.onerror=()=>rej(Error('Το αρχείο δεν διαβάστηκε.'));fr.readAsDataURL(file);});
const pickFile=accept=>new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=accept;i.onchange=()=>res(i.files[0]||null);i.click();});

/* ---------------- διάλογοι, μενού ---------------- */
function modal(title,body,{ok='Αποθήκευση',onOk=null,cancel='Ακύρωση',wide=false,extra='',id='dialog',okClass='primary'}={}){const d=$('#'+id);
 d.innerHTML=`<form method="dialog" class="dlg" onsubmit="return false"><header>${esc(title)}</header><div class="body">${body}</div><footer>${extra}<span class="grow"></span>${cancel?`<button type="button" class="btn" data-x>${esc(cancel)}</button>`:''}${onOk?`<button type="submit" class="btn ${okClass}" data-ok>${esc(ok)}</button>`:''}</footer></form>`;
 d.style.width=wide===true?'min(980px,95vw)':(wide||'');d.showModal();d.querySelector('[data-x]')?.addEventListener('click',()=>d.close());
 if(onOk)d.querySelector('[data-ok]').onclick=async e=>{e.preventDefault();const b=e.currentTarget;b.disabled=true;try{if(await onOk(d)!==false)d.close();}catch(err){toast(err.message,true);}finally{b.disabled=false;}};
 setTimeout(()=>d.querySelector('[autofocus]')?.focus(),30);return d;}
function confirmBox(text,okLabel='Συνέχεια',danger=false,title='Επιβεβαίωση'){return new Promise(res=>{let done=false;const d=modal(title,`<div style="max-width:520px;white-space:pre-line">${text}</div>`,{ok:okLabel,id:'dialog2',okClass:danger?'danger':'primary',onOk:()=>{done=true;res(true);}});d.addEventListener('close',()=>{if(!done)res(false);},{once:true});});}

 const w=menuEl.offsetWidth,h=menuEl.offsetHeight;menuEl.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';menuEl.style.top=(r.bottom+h+8>innerHeight?r.top-h-4:r.bottom+4)+'px';
 menuEl.querySelectorAll('[data-mi]').forEach(b=>b.onclick=e=>{e.stopPropagation();const it=items[+b.dataset.mi];closeMenu();it.run();});}

/* ---------------- πλαίσιο ---------------- */
const NAV=[['home','Αρχική','home'],['actions','Δράσεις','cal'],['guide','Οδηγός Ημερών','guide'],['lifelog','Ημερολόγιο Ζωής','book'],
 ['lbl','Αρχεία'],['reports','Εκτυπώσεις','print'],['transfer','Εξαγωγή & εισαγωγή','swap'],['lbl','Εφαρμογή'],['settings','Ρυθμίσεις & αντίγραφα','gear'],['help','Βοήθεια','help']];
const TITLES={home:['Αρχική',''],actions:['Δράσεις','Όλες οι δράσεις του σχολείου'],guide:['Οδηγός Ημερών & Επετείων','Επιλέξτε ημέρες και δημιουργήστε δράσεις με ένα κλικ'],
 lifelog:['Ημερολόγιο Σχολικής Ζωής','Καθημερινές καταγραφές με ημερομηνία'],reports:['Εκτυπώσεις','Αναφορές για εκτύπωση ή PDF'],transfer:['Εξαγωγή & εισαγωγή','Ημερολόγια, ιστοσελίδα, Excel'],
 settings:['Ρυθμίσεις & αντίγραφα',''],help:['Βοήθεια','Οδηγός χρήσης και συχνές ερωτήσεις']};
function frame(){
 $('#sname').textContent=S.school_name;$('#yearbtn').innerHTML=`Έτος ${esc(S.current_school_year)} ${ico('down','width:13px;height:13px')}`;
 $('#nav').innerHTML=NAV.map(p=>p[0]==='lbl'?`<li class="lbl">${p[1]}</li>`:`<li><button data-page="${p[0]}" class="${p[0]===page?'on':''}">${ico(p[2])}<span>${p[1]}</span>${p[0]==='actions'&&S._overdue?`<span class="cnt" title="Εκκρεμούν από το παρελθόν">${S._overdue}</span>`:''}${p[0]==='lifelog'&&S.lifelog.protected&&!S.lifelog.unlocked?`<span class="right" style="color:var(--faint)">${ico('lock','width:14px;height:14px')}</span>`:''}</button></li>`).join('');
 $$('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));
 const t=TITLES[page]||['',''];$('#title').textContent=t[0];
 $('#subtitle').textContent=t[1]||(page==='home'?longDate(S.today):page==='settings'?S.school_name:'');
 $('#newver').hidden=!S.update;if(S.update)$('#newver').innerHTML=`${ico('download')}Νέα έκδοση ${esc(S.update.version)}`;
 document.title=S.school_name+' – Πρόγραμμα Δράσεων';}
async function go(p){page=p;remember();if(p!=='actions'&&ui.f.search){ui.f.search='';$('#gsearch').value='';}closeDrawer();ui.checked.clear();ui.gSel.clear();$('#selbar').innerHTML='';await render();$('#content').scrollTop=0;}
async function render(){frame();const f={home:pHome,actions:pActions,guide:pGuide,lifelog:pLifelog,reports:pReports,transfer:pTransfer,settings:pSettings,help:pHelp}[page]||pHome;
 try{await f();}catch(e){$('#content').innerHTML=`<div class="note bad">${esc(e.message)}</div>`;}}
$('#yearbtn').onclick=e=>menu(e.currentTarget,[...S.school_years.slice().reverse().map(y=>({label:(y===S.current_school_year?'✓  ':'     ')+'Σχολικό έτος '+y,run:()=>setYear(y)})),'-',{label:'Νέο σχολικό έτος…',icon:'plus',run:()=>addYearDialog()}]);
async function setYear(y){const r=await call('settings/save',{current_school_year:y});if(r){S=r;ui.f.school_year=y;ui.gYear=y;ui.rep.school_year=null;ui.expYear=null;ui.month=null;toast('Ενεργό σχολικό έτος: '+y);render();}}
function addYearDialog(){const n=+S.current_school_year.slice(0,4)+1;
 modal('Νέο σχολικό έτος',`<label class="field"><span>Σχολικό έτος</span><input id="ny" value="${n}-${n+1}" autofocus></label><label class="row" style="gap:8px"><input type="checkbox" id="ny_cur" checked> Να γίνει το ενεργό σχολικό έτος</label>`,
 {ok:'Προσθήκη',onOk:async()=>{const y=$('#ny').value.trim();S=await api('years/add',{year:y,make_current:$('#ny_cur').checked});if($('#ny_cur').checked){ui.f.school_year=y;ui.gYear=y;ui.rep.school_year=null;ui.expYear=null;}toast('Προστέθηκε το σχολικό έτος '+y);render();}});}

/* ================================================================ ΑΡΧΙΚΗ */
async function pHome(){
 const D=await api('dashboard');S._overdue=D.overdue;frame();
 const h=new Date().getHours(),hi=h<12?'Καλημέρα':h<18?'Καλό απόγευμα':'Καλησπέρα';
 const first=S.first_run&&!D.total;
 const att=[];
 if(D.overdue)att.push(`<div class="att"><div class="ic" style="background:var(--warn-50);color:var(--warn)">${ico('clock')}</div><div class="grow"><b>${plural(D.overdue,'δράση πέρασε','δράσεις πέρασαν')}</b> χωρίς να σημειωθεί «Ολοκληρώθηκε»<div class="hint">Σημειώστε τι έγινε ή τι ακυρώθηκε.</div></div><button class="btn sm" data-go="overdue">Προβολή</button></div>`);
 if(calOn()&&D.calendar_pending)att.push(`<div class="att"><div class="ic" style="background:var(--brand-50);color:var(--brand)">${ico('cal')}</div><div class="grow"><b>${plural(D.calendar_pending,'δράση δεν έχει','δράσεις δεν έχουν')}</b> περαστεί στο ημερολόγιο (Google/ICS)</div><button class="btn sm" data-go="nocal">Προβολή</button></div>`);
 if(!S.backup.folder&&D.total)att.push(`<div class="att"><div class="ic" style="background:var(--ok-50);color:var(--ok)">${ico('shield')}</div><div class="grow"><b>Ημερήσιο αντίγραφο σε USB ή OneDrive</b><div class="hint">Προστατεύει τα δεδομένα αν χαλάσει ο υπολογιστής.</div></div><button class="btn sm" data-go="backup">Ρύθμιση</button></div>`);

 if(!noYear)p.push((f.school_year||S.current_school_year)==='Όλα'?'όλα τα σχολικά έτη':'σχολικό έτος '+(f.school_year||S.current_school_year));if(ui.tab!=='all')p.push(TABS.find(t=>t[0]===ui.tab)[1].toLowerCase());return p.join(' · ');}

function drawList(){

 let rows=ui.all.filter(r=>inTab(r,ui.tab));if(ui.f.date)rows=rows.filter(r=>r.action_date===ui.f.date);if(ui.tab==='overdue')rows=rows.slice().reverse();ui.rows=rows;
 const ids=new Set(rows.map(r=>r.id));for(const id of [...ui.checked])if(!ids.has(id))ui.checked.delete(id);
 let html='',cur='';
 for(const r of rows){const d=dt(r.action_date),key=r.action_date.slice(0,7);if(key!==cur){cur=key;const n=rows.filter(x=>x.action_date.slice(0,7)===key).length;

  html+=rowHtml(r);}
 const emptyMsg={all:ui.total?['Καμία δράση','Δεν βρέθηκαν δράσεις με αυτά τα κριτήρια.']:['Δεν υπάρχουν ακόμη δράσεις','Πατήστε «Νέα δράση» ή δημιουργήστε δράσεις από τον Οδηγό Ημερών.'],

 $('#a_main').innerHTML=rows.length?`<div class="list ${ui.checked.size?'anysel':''}" id="lst">${html}</div><div class="count">${plural(rows.length,'δράση','δράσεις')} · ${esc(filterSummary())}${ui.tab==='overdue'?' · πιο πρόσφατες πρώτα':''}</div>`

function bindRows(root,rows){
 const byId=id=>rows.find(r=>r.id===+id);
 root.querySelectorAll('.it[data-id]').forEach(el=>{el.onclick=e=>{if(e.target.closest('input,button'))return;openDrawer(byId(el.dataset.id));};el.ondblclick=e=>{if(!e.target.closest('input,button'))actionForm(byId(el.dataset.id));};});
 root.querySelectorAll('[data-ck]').forEach(c=>c.onchange=()=>{const id=+c.dataset.ck;c.checked?ui.checked.add(id):ui.checked.delete(id);$('#lst')?.classList.toggle('anysel',ui.checked.size>0);renderSel();});
 root.querySelectorAll('[data-mck]').forEach(c=>{const m=c.dataset.mck,ids=rows.filter(r=>r.action_date.slice(0,7)===m).map(r=>r.id);c.checked=ids.length&&ids.every(i=>ui.checked.has(i));
  c.onchange=()=>{ids.forEach(i=>c.checked?ui.checked.add(i):ui.checked.delete(i));drawList();};});
 root.querySelectorAll('[data-st]').forEach(b=>b.onclick=e=>{e.stopPropagation();statusMenu(b,[+b.dataset.st]);});
 root.querySelectorAll('[data-more]').forEach(b=>b.onclick=e=>{e.stopPropagation();actionMenu(b,byId(b.dataset.more));});}

 it.push('-',{label:'Διαγραφή',icon:'trash',danger:true,run:()=>deleteActions([r])});menu(anchor,it);}
async function bulk(ids,ch){const j=await call('actions/bulk',{ids,...ch});if(!j)return;

 if(ui.open){const r=ui.all.concat(ui.rows,ui.homeNext||[]).find(x=>x.id===ui.open);if(r&&page!=='home')openDrawer(r);else closeDrawer();}}
async function deleteActions(rows){if(!rows.length)return;
 const list=rows.slice(0,5).map(r=>'• '+disp(r.action_date)+' – '+r.title).join('\n')+(rows.length>5?`\n…και ακόμη ${rows.length-5}`:'');
 if(!await confirmBox(esc((rows.length===1?'Να διαγραφεί η δράση;':`Να διαγραφούν ${rows.length} δράσεις;`)+'\n\n'+list),'Διαγραφή',true))return;
 const j=await call('actions/delete',{ids:rows.map(r=>r.id)});if(!j)return;
 rows.forEach(r=>ui.checked.delete(r.id));if(rows.some(r=>r.id===ui.open))closeDrawer();
 toast(j.deleted===1?'Η δράση διαγράφηκε.':`Διαγράφηκαν ${j.deleted} δράσεις.`,false,{label:'Αναίρεση',run:async()=>{const u=await call('actions/undelete',{rows:j.rows});if(u){toast('Η διαγραφή αναιρέθηκε.');refreshAfterChange();}}});
 refreshAfterChange();}

async function importFile(file){
 if(/\.db$/i.test(file.name))return restoreFromFile(file);if(/\.zip$/i.test(file.name))return updateFromFile(file);
 if(!/\.(xlsx|csv|txt)$/i.test(file.name))return toast('Επιλέξτε αρχείο .xlsx ή .csv.',true);
 const data=await readFile(file);const p=await call('import/preview',{name:file.name,data});if(!p)return;
 const nd=p.duplicates.length,ne=p.errors.length;
 const body=`${p.count?`<p style="margin-top:0">Θα εισαχθούν <b>${plural(p.count,'νέα δράση','νέες δράσεις')}</b> από το «${esc(file.name)}».</p>`:'<div class="note bad">Δεν υπάρχουν νέες έγκυρες δράσεις για εισαγωγή.</div>'}
  ${nd?`<div class="note">${nd===1?'1 εγγραφή υπάρχει ήδη και θα παραλειφθεί.':`${nd} εγγραφές υπάρχουν ήδη και θα παραλειφθούν.`}</div>`:''}
  ${ne?`<div class="note bad"><b>${ne===1?'1 γραμμή έχει λάθος και δεν θα εισαχθεί:':`${ne} γραμμές έχουν λάθη και δεν θα εισαχθούν:`}</b><br>${p.errors.slice(0,15).map(esc).join('<br>')}${ne>15?'<br>…':''}</div>`:''}
  ${p.warnings.length?`<div class="note warn">${p.warnings.slice(0,8).map(esc).join('<br>')}</div>`:''}
  ${p.count?`<div class="list" style="max-height:42vh;overflow:auto">${p.records.map(r=>{const d=dt(r.action_date);return `<div class="it" style="--c:${colorOf(r.category)};grid-template-columns:54px 1fr auto;cursor:default"><div class="dbox"><b>${d.getDate()}</b><small>${MONS[d.getMonth()]} ${String(d.getFullYear()).slice(2)}</small></div><div><div class="tt">${esc(r.title)}</div><div class="mt"><span>${catHtml(r.category)}</span>${r.start_time?`<span>${esc(timeText(r))}</span>`:''}${r.class_group?`<span>${esc(r.class_group)}</span>`:''}<span class="hint">γραμμή ${r._line}</span></div></div>${pill(r.status)}</div>`;}).join('')}</div>${p.count>p.records.length?`<p class="hint">Εμφανίζονται οι πρώτες ${p.records.length}.</p>`:''}`:''}`;
 modal('Προεπισκόπηση εισαγωγής',body,{wide:'min(820px,95vw)',ok:p.count?(p.count===1?'Εισαγωγή 1 δράσης':`Εισαγωγή ${p.count} δράσεων`):'',onOk:p.count?async()=>{const r=await api('import/apply',{name:file.name,data});sgCache=null;S.first_run=false;
  toast(`Εισήχθησαν ${plural(r.imported,'δράση','δράσεις')}.`,false,{label:'Προβολή',run:()=>{Object.assign(ui.f,{search:'',category:'Όλες',status:'Όλες',calendar:'Όλες',school_year:'Όλα'});delete ui.f.date;ui.tab='all';ui.view='list';go('actions');}});}:null,cancel:p.count?'Ακύρωση':'Κλείσιμο'});}

  S=await api('datadir/set',{path:p,mode});sgCache=null;toast('Ο φάκελος δεδομένων άλλαξε.');ui.stab='data';go('settings');},true));
 $('#d_def')&&($('#d_def').onclick=async()=>{if(!await confirmBox(`Επιστροφή στον προεπιλεγμένο φάκελο:\n${esc(D.documents_default)}\n\nΑν εκεί δεν υπάρχουν δεδομένα, θα αντιγραφούν τα τρέχοντα.`))return;const r=await call('datadir/set',{mode:'default'});if(r){S=r;sgCache=null;sData();}});}
function sUpdates(){
 $('#s_body').innerHTML=`<div class="card" style="max-width:760px"><h2>Ενημερώσεις εφαρμογής</h2><p class="desc">Τρέχουσα έκδοση: <b>${esc(S.version)}</b>${S.update?` · διαθέσιμη: <b>${esc(S.update.version)}</b>`:''}</p>
  <label class="sw"><span class="t"><b>Αυτόματος έλεγχος για νέα έκδοση</b><small>Μία φορά την ημέρα. Στέλνεται μόνο αίτημα ανάγνωσης στο GitHub, κανένα στοιχείο του σχολείου.</small></span><input type="checkbox" id="u_auto" ${S.features.check_updates_on_startup?'checked':''}></label>
  <div class="row" style="margin-top:12px"><button class="btn primary" id="u_now">Έλεγχος τώρα</button><button class="btn" id="u_file">${ico('upload')}Ενημέρωση από αρχείο…</button><button class="btn" id="u_prev">${ico('undo')}Προηγούμενες εκδόσεις</button></div>
  <p class="hint" style="margin-top:12px">Χωρίς Internet: κατεβάστε σε άλλον υπολογιστή το <b>PDS_Enimerosi.zip</b> (github.com/stam1966/Imerologio/releases/latest) και επιλέξτε το με «Ενημέρωση από αρχείο…» ή σύρετέ το στο παράθυρο. Τα δεδομένα δεν επηρεάζονται.</p></div>`;
 $('#u_auto').onchange=async e=>{const r=await call('settings/save',{features:{check_updates_on_startup:e.target.checked}},'Αποθηκεύτηκε.');if(r)S=r;};
 $('#u_now').onclick=checkUpdate;$('#u_file').onclick=async()=>{const f=await pickFile('.zip');if(f)updateFromFile(f);};$('#u_prev').onclick=previousVersions;}
async function restoreFromFile(file){
 file=file||await pickFile('.db');if(!file)return;
 if(!await confirmBox(`Φόρτωση δεδομένων από το αρχείο «${esc(file.name)}»;\n\nΤα τρέχοντα δεδομένα αντικαθίστανται· πριν από αυτό κρατείται αντίγραφό τους.`,'Φόρτωση',true))return;
 const data=await readFile(file);const r=await call('backup/upload',{name:file.name,data});
 if(r){await refreshState();sgCache=null;catWork=null;toast(`Τα δεδομένα φορτώθηκαν (${plural(r.count,'δράση','δράσεις')}).`);ui.f.school_year=S.current_school_year;go('home');}}
async function folderPicker(title,start,onPick,showData){
 const draw=async path=>{let j;try{j=await api('fs/list',{path});}catch(e){toast(e.message,true);if(path)return draw('');return;}
  const body=`${j.path?`<div class="small" style="margin-bottom:8px">${j.crumbs.map(c=>`<button type="button" class="btn sm ghost" data-p="${esc(c.path)}">${esc(c.label)}</button>`).join(' › ')}</div>`:''}
   <div class="fsl">${j.path?`<button type="button" data-p="${esc(j.parent)}">⬑ Επάνω</button>`:''}${j.places.map(p=>`<button type="button" data-p="${esc(p.path)}">⭐ ${esc(p.label)}</button>`).join('')}${j.drives.map(p=>`<button type="button" data-p="${esc(p.path)}">💽 ${esc(p.label)}</button>`).join('')}
   ${j.dirs.map(d=>`<button type="button" data-p="${esc(d.path)}">📁 ${esc(d.name)}</button>`).join('')}${j.path&&!j.dirs.length?'<div class="hint" style="padding:10px">Κανένας υποφάκελος.</div>':''}</div>
   ${j.path?`<div class="row" style="margin-top:10px"><input id="fs_new" placeholder="Όνομα νέου υποφακέλου"><button type="button" class="btn sm" id="fs_mk">Δημιουργία</button></div>
   <p class="small" style="margin:10px 0 0">Επιλογή: <b>${esc(j.path)}</b> ${j.writable?'':'<span style="color:var(--danger)">(δεν επιτρέπεται εγγραφή)</span>'}${showData&&j.has_data?'<br><span style="color:var(--ok)">✓ Ο φάκελος περιέχει δεδομένα της εφαρμογής.</span>':''}</p>`:'<p class="hint">Επιλέξτε τοποθεσία.</p>'}`;
  const d=modal(title,body,{ok:'Επιλογή αυτού του φακέλου',wide:'min(720px,95vw)',onOk:async()=>{if(!j.path||!j.writable)throw Error('Επιλέξτε φάκελο με δικαίωμα εγγραφής.');return onPick(j.path,j);}});
  d.querySelector('[data-ok]').disabled=!j.path||!j.writable;$$('#dialog [data-p]').forEach(b=>b.onclick=()=>draw(b.dataset.p));
  $('#fs_mk')&&($('#fs_mk').onclick=async()=>{try{const r=await api('fs/mkdir',{parent:j.path,name:$('#fs_new').value});draw(r.path);}catch(e){toast(e.message,true);}});};
 draw(start||'');}

/* ---------- ενημερώσεις ---------- */
async function checkUpdate(){const j=await call('update/online');if(!j)return;if(!j.newer){toast('Έχετε την τελευταία έκδοση ('+j.current+').');return;}S.update=j.latest;frame();showUpdate(j.latest);}
function showUpdate(u){modal('Νέα έκδοση '+u.version,`<p style="margin-top:0">Τρέχουσα: <b>${esc(S.version)}</b> → νέα: <b>${esc(u.version)}</b></p><div class="note" style="white-space:pre-wrap;max-height:40vh;overflow:auto;max-width:640px">${esc(u.notes||'')}</div>
 <p class="hint">Η εφαρμογή ενημερώνεται και ξανανοίγει μόνη της. Τα δεδομένα δεν αγγίζονται· κρατείται αντίγραφο της τρέχουσας έκδοσης.</p>`,{ok:'Λήψη και εγκατάσταση τώρα',cancel:'Αργότερα',onOk:async()=>{await applyUpdate({online:true});}});}
function overlay(t){const ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;background:#1F4A4Cee;color:#fff;display:grid;place-items:center;z-index:100;font-size:19px;text-align:center';ov.innerHTML=t;document.body.append(ov);return ov;}
async function applyUpdate(data){const ov=overlay('Ενημέρωση εφαρμογής…<br><small>Η σελίδα θα ανανεωθεί σε λίγα δευτερόλεπτα.</small>');
 try{const j=await api('update/apply',data);ov.innerHTML='Εγκαταστάθηκε η έκδοση '+esc(j.version)+'.<br><small>Επανεκκίνηση…</small>';let n=0;const t=setInterval(async()=>{n++;try{const r=await fetch('/',{cache:'no-store'});if(r.ok&&n>2){clearInterval(t);location.reload();}}catch(e){}if(n>60){clearInterval(t);ov.innerHTML='Κλείστε και ανοίξτε ξανά την εφαρμογή.';}},1000);}
 catch(e){ov.remove();toast(e.message,true);}}
async function updateFromFile(file){const data=await readFile(file);const j=await call('update/check',{data});if(!j)return;
 if(!j.newer&&!await confirmBox(j.same?`Η έκδοση ${esc(j.version)} είναι ήδη εγκατεστημένη. Να εγκατασταθεί ξανά;`:`Το αρχείο περιέχει παλαιότερη έκδοση (${esc(j.version)}) από την τρέχουσα (${esc(j.current)}). Να εγκατασταθεί;`,'Εγκατάσταση',true))return;
 if(j.newer&&!await confirmBox(`Ενημέρωση από ${esc(j.current)} σε ${esc(j.version)};\n\n${esc(j.notes||'')}`,'Ενημέρωση'))return;applyUpdate({data});}
async function previousVersions(){const j=await call('update/backups');if(!j)return;
 modal('Προηγούμενες εκδόσεις',j.backups.length?`<p class="desc">Τρέχουσα: ${esc(j.current)}. Η επαναφορά αλλάζει μόνο την εφαρμογή, όχι τα δεδομένα.</p><div class="list">${j.backups.map(b=>`<div class="it" style="grid-template-columns:1fr auto;cursor:default"><div><b>Έκδοση ${esc(b.version)}</b> <span class="hint">· ${esc(b.date)}</span></div><button class="btn sm" data-rb="${esc(b.name)}">Επαναφορά</button></div>`).join('')}</div>`:'<p class="muted">Δεν υπάρχουν ακόμη. Δημιουργούνται αυτόματα σε κάθε ενημέρωση.</p>',{cancel:'Κλείσιμο'});
 $$('[data-rb]').forEach(b=>b.onclick=async()=>{$('#dialog').close();if(!await confirmBox('Επαναφορά της εφαρμογής στην επιλεγμένη έκδοση;','Επαναφορά',true))return;const ov=overlay('Επαναφορά έκδοσης…');try{await api('update/rollback',{name:b.dataset.rb});setTimeout(()=>location.reload(),6000);}catch(e){ov.remove();toast(e.message,true);}});}

/* ================================================================ ΒΟΗΘΕΙΑ */
const FAQ=[['Πώς φέρνω τα δεδομένα της παλιάς έκδοσης (v1.x);','Ρυθμίσεις & αντίγραφα → Αντίγραφα & δεδομένα → «Επαναφορά από αρχείο…» και επιλέξτε το school_actions.db από τον φάκελο data (ή Shared\\data) της παλιάς εφαρμογής. Μεταφέρονται όλα, μαζί με τον κωδικό του Ημερολογίου.'],
 ['Πώς περνάω τις δράσεις στο Google Calendar;','Εξαγωγή & εισαγωγή → «Ημερολόγιο (Google, Outlook, κινητό)». Στο Google Calendar: Ρυθμίσεις → Εισαγωγή & εξαγωγή → Εισαγωγή → επιλέξτε το αρχείο .ics. Αν ξαναεισαγάγετε αργότερα, τα ίδια γεγονότα ενημερώνονται αντί να διπλασιάζονται.'],
 ['Τι σημαίνει «Εκκρεμούν»;','Δράσεις που η ημερομηνία τους πέρασε αλλά δεν σημειώθηκαν ως «Ολοκληρώθηκε» ή «Ακυρώθηκε». Σημειώστε τι έγινε ώστε οι αναφορές απολογισμού να είναι σωστές.'],
 ['Πώς αλλάζω γρήγορα την κατάσταση μιας δράσης;','Πατήστε την ετικέτα κατάστασης (π.χ. «Προγραμματισμένη») δίπλα στη δράση και επιλέξτε τη νέα. Για πολλές μαζί, τσεκάρετέ τες και χρησιμοποιήστε τη μπάρα που εμφανίζεται κάτω.'],
 ['Διέγραψα κάτι κατά λάθος.','Αμέσως μετά τη διαγραφή εμφανίζεται κουμπί «Αναίρεση». Επιπλέον, πριν από κάθε διαγραφή κρατείται αντίγραφο ασφαλείας (Ρυθμίσεις & αντίγραφα → Αντίγραφα & δεδομένα).'],
 ['Θέλω την εφαρμογή σε δύο υπολογιστές με τα ίδια δεδομένα.','Ρυθμίσεις & αντίγραφα → Αντίγραφα & δεδομένα → «Αλλαγή φακέλου…» και επιλέξτε τον ίδιο κοινόχρηστο φάκελο σε όλους. Ανοίγει σε έναν υπολογιστή κάθε φορά.'],
 ['Ξέχασα τον κωδικό του Ημερολογίου Σχολικής Ζωής.','Δεν ανακτάται. Αν υπάρχει αντίγραφο ασφαλείας από πριν από την αλλαγή του, η επαναφορά φέρνει και τον παλιό κωδικό.'],
 ['Η εφαρμογή δεν ανοίγει.','Από το μενού Έναρξη ανοίξτε «Πρόγραμμα Δράσεων Σχολείου (διάγνωση προβλημάτων)». Εμφανίζει τι συμβαίνει· το αρχείο καταγραφής βρίσκεται στο %LOCALAPPDATA%\\ProgrammaDraseon\\app.log.']];

 $('#content').innerHTML=`<div class="wrap"><div class="grid2"><div class="card"><h2>Οδηγός χρήσης</h2><p class="desc">Όλες οι λειτουργίες βήμα-βήμα.</p><button class="btn primary" id="h_man">${ico('book')}Άνοιγμα οδηγού</button></div>

$('#gsearch').onkeydown=e=>{if(e.key==='Escape'){e.target.value='';ui.f.search='';if(page==='actions'){drawChips();loadActions();}}};
document.addEventListener('keydown',e=>{if($('#dialog').open||$('#dialog2').open)return;
 if(e.key==='Escape'){closeMenu();if(ui.open)closeDrawer();}
 if(e.ctrlKey&&(e.key==='n'||e.key==='ν')){e.preventDefault();actionForm(null);}
 if(e.ctrlKey&&(e.key==='f'||e.key==='φ')){e.preventDefault();$('#gsearch').focus();$('#gsearch').select();}});
let dragN=0;document.addEventListener('dragenter',e=>{if([...e.dataTransfer.types].includes('Files')){dragN++;document.body.classList.add('filedrag');}});
document.addEventListener('dragleave',()=>{if(--dragN<=0){dragN=0;document.body.classList.remove('filedrag');}});document.addEventListener('dragover',e=>e.preventDefault());

 try{const D=await api('dashboard');S._overdue=D.overdue;}catch(e){}
 await render();
 if(S.update)toast('Διαθέσιμη νέα έκδοση '+S.update.version+'.',false,{label:'Προβολή',run:()=>showUpdate(S.update)});})();

<!doctype html><html lang="el"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Πρόγραμμα Δράσεων Σχολείου</title>
<link rel="icon" href="/logo.png">
<style>
:root{--primary:#2F6F73;--primary2:#24504F;--primary-dark:#1E4446;--primary-soft:#E8F2F1;--gold:#D4A017;--gold-soft:#FFF4CC;--bg:#F4F5F2;--surface:#FFFFFF;--line:#DDE4E2;--line2:#EAEFED;
 --text:#2B2F33;--muted:#5F6B76;--faint:#8A959B;--head:#34495E;--danger:#B83A2B;--danger-soft:#FBE9E6;--ok:#3F7F48;--ok-soft:#E5F2E6;--internal:#8A4B00;--internal-soft:#FFEBD2;--focus:#1F6FD1;
 --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:13.5px/1.45 var(--font);color:var(--text);background:var(--bg);overflow:hidden;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.app{display:grid;grid-template-columns:228px 1fr;height:100vh}
/* πλευρική στήλη */
.side{background:linear-gradient(180deg,var(--primary2),var(--primary-dark));color:#E3EEEC;display:flex;flex-direction:column;min-height:0}
.brand{display:flex;gap:10px;align-items:center;padding:14px 14px 12px;border-bottom:1px solid #ffffff1c}.brand img{width:40px;height:40px;border-radius:50%;background:#fff;flex-shrink:0}
.brand b{display:block;font-size:13.5px;font-weight:600;color:#fff;line-height:1.25}.brand span{font-size:11.5px;color:#B8D0CC}
.nav{list-style:none;margin:8px 0;padding:0 8px;flex:1;overflow:auto}
.nav button{display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center;width:100%;border:0;background:none;color:#E3EEEC;padding:8px 9px;border-radius:7px;cursor:pointer;text-align:left}
.nav button:hover{background:#ffffff14}.nav button.on{background:#ffffff24;color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.nav .badge{font-size:11px;padding:0 7px;border-radius:9px;background:var(--gold);color:#3B2F00;font-weight:700}
.nav .sep{height:1px;background:#ffffff1c;margin:6px 6px}
.sidefoot{padding:10px 14px 12px;border-top:1px solid #ffffff1c;font-size:11.5px;color:#B8D0CC;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.sidefoot button{background:none;border:1px solid #ffffff38;color:#E3EEEC;border-radius:5px;padding:3px 9px;cursor:pointer}.sidefoot button:hover{background:#ffffff14}
.sidefoot .newver{background:var(--gold);border-color:var(--gold);color:#2E2400;font-weight:700}
/* κύρια περιοχή */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);min-height:56px}
.top h1{font-size:19px;font-weight:600;margin:0;color:var(--head);white-space:nowrap}.top .sub{color:var(--muted);font-size:12.5px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{flex:1;overflow:auto;padding:16px 20px 28px;min-height:0}
.wrap{max-width:1320px}
/* στοιχεία */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #C9D6D3;background:var(--surface);border-radius:7px;padding:6px 13px;cursor:pointer;white-space:nowrap;color:var(--primary);font-weight:600}
.btn:hover:not(:disabled){background:var(--primary-soft)}.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover:not(:disabled){background:var(--primary2)}
.btn.gold{background:var(--gold);border-color:#B98B10;color:#fff}.btn.gold:hover:not(:disabled){background:#BF9014}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff}.btn.okb:hover:not(:disabled){background:#356B3D}
.btn.danger{color:var(--danger);border-color:#E3B9B2}.btn.danger:hover:not(:disabled){background:var(--danger-soft)}
.btn.small{padding:3px 9px;font-size:12px;font-weight:600}.btn.link{border:0;background:none;padding:0 2px;text-decoration:underline;font-weight:500}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
input[type=text],input[type=search],input[type=password],input[type=date],input[type=time],input[type=number],input:not([type]),select,textarea{border:1px solid #C4CFCC;border-radius:6px;padding:6px 8px;background:#fff;max-width:100%}
textarea{resize:vertical;width:100%}input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary);vertical-align:-3px;margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.muted{color:var(--muted)}.small{font-size:12px}.right{margin-left:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:15.5px;font-weight:650;margin:0 0 4px;color:var(--primary)}.card h3{font-size:13.5px;font-weight:650;margin:16px 0 6px;color:var(--head)}.card>p.muted{margin:0 0 12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}.grid2>.card{margin:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.field>span{font-size:12px;color:var(--muted);font-weight:600}.field input,.field select,.field textarea{width:100%}.field .check input{width:16px;flex-shrink:0}.field .check{font-weight:400;color:var(--text);font-size:13.5px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.check{display:flex;gap:8px;align-items:flex-start;padding:4px 0;cursor:pointer}.check input{margin-top:2px}.check small{display:block;color:var(--muted)}
.note{background:var(--gold-soft);border:1px solid #EBD58A;border-radius:8px;padding:9px 13px;margin:8px 0}.note.info{background:var(--primary-soft);border-color:#C3DBD8}.note.bad{background:var(--danger-soft);border-color:#E7B9B1}
.empty{padding:30px;text-align:center;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:12px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.st-0{background:#FFF4CC;color:#7A5A00}.st-1{background:var(--ok-soft);color:var(--ok)}.st-2{background:var(--danger-soft);color:var(--danger)}.st-3{background:#ECEFF3;color:#4B5865}
.chip.int{background:var(--internal-soft);color:var(--internal)}
.seg{display:inline-flex;border:1px solid #C9D6D3;border-radius:7px;overflow:hidden;background:#fff}.seg button{border:0;background:none;padding:6px 13px;cursor:pointer;border-right:1px solid #C9D6D3;color:var(--primary);font-weight:600}.seg button:last-child{border-right:0}.seg button.on{background:var(--primary);color:#fff}.seg svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-right:3px}
/* πίνακες */
.tblwrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:auto}
table{border-collapse:collapse}.tbl{width:100%}.tbl th{font-size:12px;font-weight:650;color:var(--head);text-align:left;padding:8px 9px;border-bottom:2px solid var(--primary);background:#EEF3F2;position:sticky;top:0;z-index:1;white-space:nowrap}
.tbl td{padding:7px 9px;border-bottom:1px solid var(--line2);vertical-align:top;overflow-wrap:break-word}.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#F4F8F7}
.tbl tr.sel td{background:#FFF7DA!important}.tbl tr.int td{background:#FFF6EA}.tbl tr.done td{color:#56615C}.tbl tr.cancel td{color:var(--faint);text-decoration:line-through;text-decoration-color:#0003}
.tbl td.c,.tbl th.c{text-align:center;width:34px}.tbl .date{white-space:nowrap}.tbl .date small{display:block;color:var(--faint);font-size:11px}.tbl .desc{color:var(--muted);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tbl td.num{text-align:right}.tbl .ttl{font-weight:600}.tbl td.cat{font-size:12.5px;min-width:120px}.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* σελίδα δράσεων */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.toolbar .search{width:280px}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:12.5px}.filters label{display:flex;gap:6px;align-items:center;color:var(--muted);font-weight:600}.filters select{max-width:250px}
.bulkbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#FFF7DA;border:1px solid #EBD58A;border-radius:8px;padding:7px 12px;margin-bottom:10px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;align-items:start}.split>*{min-width:0}
.details{position:sticky;top:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.details h2{font-size:15px;margin:0 0 6px;color:var(--head)}.details .meta{font-size:12.5px;color:var(--muted);display:grid;gap:3px;margin-bottom:10px}.details .meta b{color:var(--text);font-weight:600}
.details .descr{white-space:pre-wrap;font-size:12.5px;background:#FAFBFA;border:1px solid var(--line2);border-radius:7px;padding:8px 10px;max-height:220px;overflow:auto;margin-bottom:10px}
.details .acts{display:grid;gap:6px}.details .acts .btn{justify-content:center}
.count{color:var(--muted);font-size:12px;padding:6px 2px}
/* μηνιαία προβολή */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.calhead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}.calhead b{font-size:15px;color:var(--head);min-width:170px;text-align:center}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.calgrid .dow{background:#EEF3F2;font-size:12px;font-weight:650;color:var(--head);padding:5px 8px;border-bottom:1px solid var(--line)}
.day{min-height:104px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:4px 5px;position:relative}.day:nth-child(7n){border-right:0}
.day.out{background:#FAFBFA}.day.out .dn{color:#B7C0BD}.day.we{background:#FBFBF8}.day.today .dn{background:var(--primary);color:#fff;border-radius:10px;padding:0 7px}
.day .dn{font-size:12px;font-weight:650;color:var(--muted);display:inline-block;margin-bottom:3px}.day .add{position:absolute;right:4px;top:3px;border:0;background:none;color:var(--primary);font-weight:700;cursor:pointer;opacity:0;font-size:15px;line-height:1}.day:hover .add{opacity:.8}
.ev{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;width:100%;text-align:left;border:0;border-left:3px solid var(--primary);background:var(--primary-soft);border-radius:4px;padding:2px 5px;margin-bottom:3px;font-size:11.5px;line-height:1.3;cursor:pointer;overflow:hidden}
.ev.s1{border-color:var(--ok);background:var(--ok-soft)}.ev.s2{border-color:var(--danger);background:var(--danger-soft);text-decoration:line-through}.ev.s3{border-color:#7A8794;background:#ECEFF3}.ev.int{border-color:var(--internal);background:var(--internal-soft)}.ev.sel{outline:2px solid var(--gold)}
.ev.guide{border-color:#B7C0BD;border-left-style:dashed;background:#fff;color:var(--muted);font-style:italic}
/* αρχική */
.hero{display:flex;gap:18px;align-items:center;background:linear-gradient(110deg,#FFFFFF 40%,#EAF4F2);border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin-bottom:14px}
.hero h2{margin:0 0 4px;font-size:22px;color:var(--head)}.hero p{margin:0;color:var(--muted)}.hero .bar{width:90px;height:3px;background:var(--gold);margin-top:10px;border-radius:2px}.hero img{width:74px;height:74px;margin-left:auto}
.stat{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff;cursor:pointer}.stat:hover{border-color:#B8CFCB}
.stat .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;flex-shrink:0}.stat .ic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stat b{display:block;font-size:26px;line-height:1.1}.stat span{font-size:12.5px;color:var(--muted)}.stat strong{font-size:13px;color:var(--head)}
.upl{display:flex;flex-direction:column;gap:7px}.upi{display:flex;gap:12px;align-items:center;border:1px solid var(--line2);border-radius:9px;padding:7px 10px;cursor:pointer;background:#fff}.upi:hover{border-color:#B8CFCB;background:#FBFDFC}
.dbox{width:50px;flex-shrink:0;text-align:center;background:var(--primary-soft);color:var(--primary);border-radius:8px;padding:4px 0;line-height:1.1}.dbox b{display:block;font-size:17px}.dbox small{font-size:10.5px;font-weight:700}.dbox.int{background:var(--internal-soft);color:var(--internal)}
.upi .t{font-weight:600}.upi .m{font-size:12px;color:var(--muted)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick .btn{justify-content:center;padding:9px 8px}
.glance{display:grid;gap:6px;margin-top:12px}.glance button{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line2);background:#FAFCFB;border-radius:7px;padding:6px 10px;cursor:pointer;text-align:left}.glance button:hover{border-color:#B8CFCB}
.glance b{min-width:34px;text-align:center;border-radius:6px;padding:1px 6px}
/* διάλογοι */
dialog{border:0;border-radius:12px;box-shadow:0 18px 60px #0005;padding:0;max-width:min(1000px,95vw);width:max-content;min-width:440px;max-height:92vh}
dialog::backdrop{background:#1E2A3266}.dlg{display:flex;flex-direction:column;max-height:92vh}.dlg header{padding:15px 20px 8px;font-size:17px;font-weight:650;color:var(--head)}
.dlg .body{padding:4px 20px 12px;overflow:auto}.dlg footer{display:flex;gap:8px;justify-content:flex-end;padding:11px 20px 15px;border-top:1px solid var(--line2);align-items:center}
.sect{border:1px solid var(--line);border-radius:9px;padding:10px 13px;margin-bottom:10px}.sect>b{display:block;color:var(--primary);margin-bottom:8px;font-size:13px}
.checklist{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:7px;padding:4px 10px}.checklist label{display:flex;gap:8px;align-items:center;padding:3px 0}
.fsl{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px;min-width:min(600px,80vw)}.fsl button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;cursor:pointer}.fsl button:hover{background:var(--primary-soft)}
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:6px;z-index:50}.toast{background:#22302E;color:#fff;border-radius:8px;padding:9px 15px;box-shadow:0 6px 20px #0003;max-width:460px;white-space:pre-line}.toast.bad{background:var(--danger)}
.preview{width:100%;height:calc(100vh - 230px);min-height:460px;border:1px solid var(--line);border-radius:8px;background:#fff}
.lock{max-width:560px;margin:40px auto;text-align:center}.lock svg{width:54px;height:54px;stroke:var(--primary);fill:none;stroke-width:1.6}
.drop{border:2px dashed #B8CFCB;border-radius:10px;padding:22px;text-align:center;color:var(--muted);background:#FBFDFC}.drop.on{border-color:var(--primary);background:var(--primary-soft)}
.catlist{border:1px solid var(--line);border-radius:8px;overflow:hidden}.catlist div{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line2);cursor:pointer}.catlist div:last-child{border-bottom:0}.catlist div.on{background:#FFF7DA}.catlist div:hover{background:#F4F8F7}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11.5px;background:#fff}
.dropall{position:fixed;inset:12px;border:3px dashed var(--gold);border-radius:14px;background:#24504Fcc;color:#fff;display:none;place-items:center;font-size:18px;z-index:90;pointer-events:none}body.filedrag .dropall{display:grid}
@media (max-width:1100px){.split{grid-template-columns:1fr}.details{position:static}.grid3{grid-template-columns:1fr}}
@media print{.side,.top{display:none}}
</style>
<div class="app">
<aside class="side">
 <div class="brand"><img src="/logo.png" alt=""><div><b id="sname">Πρόγραμμα Δράσεων Σχολείου</b><span id="syear"></span></div></div>
 <ul class="nav" id="nav"></ul>
 <div class="sidefoot"><span>έκδοση __VERSION__</span><button id="newver" class="newver" hidden>Νέα έκδοση</button><button id="exit" title="Κλείσιμο εφαρμογής">Έξοδος</button></div>
</aside>
<div class="main"><div class="top"><h1 id="title"></h1><span class="sub" id="subtitle"></span><span id="topact"></span></div><div class="content" id="content"></div></div>
</div>
<dialog id="dialog"></dialog><dialog id="dialog2"></dialog><div class="toasts" id="toasts"></div><div class="dropall" id="dropall">Αφήστε το αρχείο εδώ</div>
<script>
'use strict';
const token='__TOKEN__',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=null,page='home';
const ui={filters:{search:'',category:'Όλες',status:'Όλες',calendar:'Όλες',school_year:null,special:''},view:'list',month:null,sel:null,checked:new Set(),rows:[],total:0,
 guideYear:null,guideCat:'Όλες',guideSel:new Set(),guideItems:[],llSearch:'',llFrom:'',llTo:'',rep:{type:'all',status:'Όλες',category:'Όλες',include_internal:true,categories:null}};
try{const m=JSON.parse(localStorage.getItem('pds.ui')||'{}');if(m.page)page=m.page;if(m.view)ui.view=m.view;if(m.filters)Object.assign(ui.filters,m.filters,{search:'',special:''});}catch(e){}
function remember(){try{localStorage.setItem('pds.ui',JSON.stringify({page,view:ui.view,filters:ui.filters}));}catch(e){}}

/* ---------- επικοινωνία ---------- */
async function api(path,data={}){let r;try{r=await fetch('/api/'+path,{method:'POST',headers:{'X-App-Token':token,'Content-Type':'application/json'},body:JSON.stringify(data)});}
 catch(e){throw Error('Η επικοινωνία με την εφαρμογή απέτυχε. Είναι ανοικτή;');}
 let j={};try{j=await r.json();}catch(e){}
 if(!r.ok){if(r.status===423&&page==='lifelog'&&path!=='lifelog/unlock'){S.lifelog.unlocked=false;render();}throw Error(j.error||'Σφάλμα επικοινωνίας ('+r.status+').');}return j;}
async function call(path,data,done){try{let j=await api(path,data);if(done)toast(done);return j;}catch(e){toast(e.message,true);return null;}}
async function refreshState(){S=await api('state');}
function toast(t,bad){let el=document.createElement('div');el.className='toast'+(bad?' bad':'');el.textContent=t;$('#toasts').append(el);setTimeout(()=>el.remove(),bad?7000:3200);}
const b64toBlob=(b,m)=>{let s=atob(b),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new Blob([a],{type:m||'application/octet-stream'});};
async function saveFile(blob,name){
 if(window.showSaveFilePicker){try{let ext=name.split('.').pop();let h=await showSaveFilePicker({suggestedName:name,types:[{description:ext.toUpperCase(),accept:{[blob.type.split(';')[0]||'application/octet-stream']:['.'+ext]}}]});
  let w=await h.createWritable();await w.write(blob);await w.close();toast('Αποθηκεύτηκε: '+h.name);return true;}catch(e){if(e.name==='AbortError')return false;}}
 let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('Το αρχείο αποθηκεύτηκε στις Λήψεις: '+name);return true;}
function readFile(file){return new Promise((res,rej)=>{let fr=new FileReader();fr.onload=()=>res(fr.result.split(',')[1]||'');fr.onerror=()=>rej(Error('Το αρχείο δεν διαβάστηκε.'));fr.readAsDataURL(file);});}
function pickFile(accept){return new Promise(res=>{let i=document.createElement('input');i.type='file';i.accept=accept;i.onchange=()=>res(i.files[0]||null);i.click();});}

/* ---------- διάλογοι ---------- */
function modal(title,body,{ok='Αποθήκευση',onOk=null,cancel='Ακύρωση',wide=false,extra='',id='dialog',okClass='primary'}={}){let d=$('#'+id);
 d.innerHTML=`<form method="dialog" class="dlg" onsubmit="return false"><header>${esc(title)}</header><div class="body">${body}</div><footer>${extra}<span class="grow"></span>${cancel?`<button type="button" class="btn" data-x>${esc(cancel)}</button>`:''}${onOk?`<button type="submit" class="btn ${okClass}" data-ok>${esc(ok)}</button>`:''}</footer></form>`;
 d.style.width=wide===true?'min(980px,95vw)':(wide||'');d.showModal();d.querySelector('[data-x]')?.addEventListener('click',()=>d.close());
 if(onOk)d.querySelector('[data-ok]').onclick=async e=>{e.preventDefault();let b=e.currentTarget;b.disabled=true;try{if(await onOk(d)!==false)d.close();}catch(err){toast(err.message,true);}finally{b.disabled=false;}};
 setTimeout(()=>d.querySelector('[autofocus]')?.focus(),30);return d;}

async function deleteActions(ids){const rows=ui.rows.filter(r=>ids.includes(r.id));if(!rows.length)return;

async function loadMonth(){

 const f=actionFilters();f.school_year='Όλα';f.date_from=isoOf(start);f.date_to=isoOf(end);
 const [j,g]=await Promise.all([api('actions/list',{filters:f}),api('guide/list',{school_year:schoolYearOf(first)})]);ui.rows=j.rows;
 const byDay={};j.rows.forEach(r=>(byDay[r.action_date]=byDay[r.action_date]||[]).push(r));
 const gd={};(g.items||[]).forEach(i=>{if(!i.exists)(gd[i.date]=gd[i.date]||[]).push(i);});

   ${ev.map(r=>`<button class="ev s${stIdx(r.status)} ${r.internal?'int':''} ${ui.sel===r.id?'sel':''}" data-ev="${r.id}" title="${esc(r.title+(timeText(r)?' • '+timeText(r):''))}">${r.start_time?`<b>${r.start_time}</b> `:''}${esc(r.title)}</button>`).join('')}
   ${ui.showGuide!==false?(gd[iso]||[]).map(i=>`<button class="ev guide" data-gd="${esc(JSON.stringify(i))}" title="Από τον Οδηγό: ${esc(i.title)} (κλικ για δημιουργία δράσης)">${esc(i.title)}</button>`).join(''):''}</div>`;}
 $('#a_main').innerHTML=`<div class="cal"><div class="calhead"><button class="btn small" id="m_prev">‹</button><b>${MON[m]} ${y}</b><button class="btn small" id="m_next">›</button><button class="btn small" id="m_today">Σήμερα</button>

  <div class="calgrid">${['Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο','Κυριακή'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div></div>
  <div class="count">${plural(j.rows.filter(r=>r.action_date.slice(0,7)===`${y}-${String(m+1).padStart(2,'0')}`).length,'δράση','δράσεις')} τον μήνα • ${esc(filterSummary(true)||'χωρίς φίλτρα')}</div>`;
 $('#m_prev').onclick=()=>{ui.month=m?[y,m-1]:[y-1,11];loadMonth();};$('#m_next').onclick=()=>{ui.month=m<11?[y,m+1]:[y+1,0];loadMonth();};$('#m_today').onclick=()=>{ui.month=null;loadMonth();};
 $('#m_guide').onchange=e=>{ui.showGuide=e.target.checked;loadMonth();};
 $$('[data-ev]').forEach(b=>{b.onclick=()=>{ui.sel=+b.dataset.ev;$$('.ev.sel').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');renderDetails();};b.ondblclick=()=>actionForm(ui.rows.find(r=>r.id===+b.dataset.ev));});
 $$('[data-add]').forEach(b=>b.onclick=e=>{e.stopPropagation();actionForm(null,b.dataset.add);});
 $$('[data-day]').forEach(d=>d.ondblclick=e=>{if(e.target===d||e.target.classList.contains('dn'))actionForm(null,d.dataset.day);});
 $$('[data-gd]').forEach(b=>b.onclick=()=>{let i=JSON.parse(b.dataset.gd);actionForm({id:null,action_date:i.date,title:i.title,category:i.category,description:i.description,status:'Προγραμματισμένη'},null,'Νέα δράση από τον Οδηγό Ημερών');});
 renderBulk();renderDetails();}
const schoolYearOf=d=>{let y=d.getMonth()>=8?d.getFullYear():d.getFullYear()-1;return y+'-'+(y+1);};

async function importFile(file){
 if(/\.db$/i.test(file.name))return restoreFromFile(file);
 if(/\.zip$/i.test(file.name))return updateFromFile(file);
 if(!/\.(xlsx|csv|txt)$/i.test(file.name))return toast('Επιλέξτε αρχείο .xlsx ή .csv.',true);
 const data=await readFile(file);const p=await call('import/preview',{name:file.name,data});if(!p)return;
 const body=`${p.count?`<p>Θα εισαχθούν <b>${plural(p.count,'νέα δράση','νέες δράσεις')}</b> από το αρχείο «${esc(file.name)}».</p>`:'<div class="note bad">Δεν υπάρχουν νέες έγκυρες δράσεις για εισαγωγή.</div>'}
  ${p.duplicates.length?`<div class="note info">Παραλείπονται ${plural(p.duplicates.length,'διπλότυπη εγγραφή','διπλότυπες εγγραφές')} (υπάρχουν ήδη).</div>`:''}
  ${p.errors.length?`<div class="note bad"><b>Γραμμές με λάθη (${p.errors.length}) — δεν θα εισαχθούν:</b><br>${p.errors.slice(0,20).map(esc).join('<br>')}${p.errors.length>20?'<br>…':''}</div>`:''}
  ${p.warnings.length?`<div class="note">${p.warnings.slice(0,10).map(esc).join('<br>')}</div>`:''}
  ${p.count?`<div class="tblwrap" style="max-height:44vh"><table class="tbl"><thead><tr><th>Γρ.</th><th>Ημερομηνία</th><th>Τίτλος</th><th>Κατηγορία</th><th>Ώρα</th><th>Τάξη</th><th>Κατάσταση</th></tr></thead><tbody>${p.records.map(r=>`<tr><td class="muted">${r._line}</td><td class="date">${disp(r.action_date)}</td><td>${esc(r.title)}</td><td>${esc(r.category)}</td><td>${esc(timeText(r))}</td><td>${esc(r.class_group)}</td><td>${statusChip(r.status)}</td></tr>`).join('')}</tbody></table></div>${p.count>p.records.length?`<p class="small muted">Εμφανίζονται οι πρώτες ${p.records.length}.</p>`:''}`:''}`;
 modal('Προεπισκόπηση εισαγωγής',body,{wide:true,ok:p.count?(p.count===1?'Εισαγωγή 1 δράσης':`Εισαγωγή ${p.count} δράσεων`):'',onOk:p.count?async()=>{const r=await api('import/apply',{name:file.name,data});suggestCache=null;S.first_run=false;
  toast(`Εισήχθησαν: ${plural(r.imported,'δράση','δράσεις')}.`+(r.backup?'\nΔημιουργήθηκε αντίγραφο ασφαλείας πριν από την εισαγωγή.':''));ui.filters.school_year='Όλα';ui.filters.special='';go('actions');}:null,cancel:p.count?'Ακύρωση':'Κλείσιμο'});}

 $('#c_undo').onclick=()=>{catWork=null;pSettings();};
 const c=W.sel,cf=W.cfg[c]||{};if(!c){$('#c_props').innerHTML='';return;}
 const ck=(k,t,dis)=>`<label class="check"><input type="checkbox" data-ck="${k}" ${cf[k]!==false&&cf[k]?'checked':''} ${dis?'disabled':''}> ${t}</label>`;
 const fixed=c==='Εσωτερική Αξιολόγηση';
 $('#c_props').innerHTML=`<div class="sect"><b>${esc(c)}</b>${c!=='Άλλο'?`<label class="field"><span>Όνομα</span><input id="c_name" value="${esc(c)}"></label>`:''}
  ${ck('internal','Εσωτερικής χρήσης (🔒)',fixed)}${ck('website','Εξαγωγή σε πίνακα ιστοσελίδας',fixed)}${ck('google','Εξαγωγή σε Google Calendar',fixed)}${ck('ics','Εξαγωγή σε ICS',fixed)}${ck('reports','Εμφάνιση στις εκτυπώσεις / αναφορές')}
  <label class="field" style="margin-top:6px"><span>Εικονίδιο ένδειξης</span><select id="c_icon">${S.icon_choices.map(([i,t])=>opt(i,(i?i+' ':'')+t,cf.icon||'')).join('')}</select></label>
  ${fixed?'<p class="small muted" style="margin:0">Η «Εσωτερική Αξιολόγηση» δεν εξάγεται ποτέ σε ημερολόγια ή ιστοσελίδα.</p>':''}
  ${c!=='Άλλο'?'<button class="btn small danger" id="c_del">Διαγραφή κατηγορίας</button>':''}</div>`;
 $$('[data-ck]').forEach(x=>x.onchange=()=>{cf[x.dataset.ck]=x.checked;if(x.dataset.ck==='internal'&&x.checked&&!cf.icon){cf.icon='🔒';}W.cfg[c]=cf;drawCats();});
 $('#c_icon').onchange=e=>{cf.icon=e.target.value;W.cfg[c]=cf;drawCats();};
 $('#c_name')&&($('#c_name').onchange=e=>{let v=e.target.value.trim();if(!v||v===c)return;if(W.cats.includes(v)){toast('Υπάρχει ήδη αυτή η κατηγορία.',true);e.target.value=c;return;}
  let orig=Object.keys(W.renames).find(k=>W.renames[k]===c)||c;if(S.categories.includes(orig))W.renames[orig]=v;W.cats[W.cats.indexOf(c)]=v;W.cfg[v]=cf;delete W.cfg[c];W.sel=v;drawCats();});
 $('#c_del')&&($('#c_del').onclick=async()=>{if(!await confirmBox(`Να διαγραφεί η κατηγορία «${c}»;\nΟι δράσεις της θα μεταφερθούν στο «Άλλο» όταν αποθηκεύσετε.`,'Διαγραφή',true))return;W.cats=W.cats.filter(x=>x!==c);delete W.cfg[c];W.sel=W.cats[0];drawCats();});}

/* ---------- ενημερώσεις ---------- */
async function checkUpdate(){const j=await call('update/online');if(!j)return;
 if(!j.newer){toast('Έχετε την τελευταία έκδοση ('+j.current+').');return;}S.update=j.latest;renderFrame();showUpdate(j.latest);}
function showUpdate(u){modal('Νέα έκδοση '+u.version,`<p>Τρέχουσα έκδοση: <b>${esc(S.version)}</b> → νέα: <b>${esc(u.version)}</b></p><div class="note info" style="white-space:pre-wrap;max-height:40vh;overflow:auto;max-width:640px">${esc(u.notes||'')}</div>
 <p class="small muted">Η εφαρμογή θα ενημερωθεί και θα ξανανοίξει μόνη της. Τα δεδομένα δεν αγγίζονται· κρατείται αντίγραφο της τρέχουσας έκδοσης για επαναφορά.</p>`,{ok:'Λήψη και εγκατάσταση τώρα',onOk:async()=>{await applyUpdate({online:true});}});}
async function applyUpdate(data){const ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;background:#24504Fee;color:#fff;display:grid;place-items:center;z-index:100;font-size:18px;text-align:center';ov.innerHTML='Ενημέρωση εφαρμογής…<br><small>Η σελίδα θα ανανεωθεί σε λίγα δευτερόλεπτα.</small>';document.body.append(ov);
 try{const j=await api('update/apply',data);ov.innerHTML='Εγκαταστάθηκε η έκδοση '+esc(j.version)+'.<br><small>Επανεκκίνηση…</small>';let n=0;const t=setInterval(async()=>{n++;try{let r=await fetch('/',{cache:'no-store'});if(r.ok&&n>2){clearInterval(t);location.reload();}}catch(e){}if(n>60){clearInterval(t);ov.innerHTML='Κλείστε και ανοίξτε ξανά την εφαρμογή.';}},1000);}
 catch(e){ov.remove();toast(e.message,true);}}
async function updateFromFile(file){const data=await readFile(file);const j=await call('update/check',{data});if(!j)return;
 if(!j.newer&&!await confirmBox(j.same?`Η έκδοση ${j.version} είναι ήδη εγκατεστημένη. Να εγκατασταθεί ξανά;`:`Το αρχείο περιέχει παλαιότερη έκδοση (${j.version}) από την τρέχουσα (${j.current}). Να εγκατασταθεί;`,'Εγκατάσταση',true))return;
 if(j.newer&&!await confirmBox(`Ενημέρωση από ${j.current} σε ${j.version};\n\n${j.notes||''}`,'Ενημέρωση'))return;applyUpdate({data});}
async function previousVersions(){const j=await call('update/backups');if(!j)return;
 modal('Προηγούμενες εκδόσεις',j.backups.length?`<p class="muted">Τρέχουσα έκδοση: ${esc(j.current)}. Η επαναφορά αλλάζει μόνο την εφαρμογή, όχι τα δεδομένα.</p><table class="tbl"><thead><tr><th>Έκδοση</th><th>Αποθηκεύτηκε</th><th></th></tr></thead><tbody>${j.backups.map(b=>`<tr><td>${esc(b.version)}</td><td>${esc(b.date)}</td><td><button class="btn small" data-rb="${esc(b.name)}">Επαναφορά</button></td></tr>`).join('')}</tbody></table>`:'<p class="muted">Δεν υπάρχουν αποθηκευμένες προηγούμενες εκδόσεις. Δημιουργούνται αυτόματα σε κάθε ενημέρωση.</p>',{cancel:'Κλείσιμο'});
 $$('[data-rb]').forEach(b=>b.onclick=async()=>{$('#dialog').close();if(await confirmBox('Επαναφορά της εφαρμογής στην επιλεγμένη έκδοση;','Επαναφορά',true))rollback(b.dataset.rb);});}
async function rollback(name){const ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;background:#24504Fee;color:#fff;display:grid;place-items:center;z-index:100;font-size:18px';ov.textContent='Επαναφορά έκδοσης…';document.body.append(ov);
 try{await api('update/rollback',{name});setTimeout(()=>location.reload(),6000);}catch(e){ov.remove();toast(e.message,true);}}

/* ================================================================ Οδηγίες */

 $('#content').innerHTML=`<div class="wrap"><div class="grid2"><div class="card"><h2>Οδηγός χρήσης</h2><p class="muted">Αναλυτικές οδηγίες για όλες τις λειτουργίες, με τα πρώτα βήματα και συχνές ερωτήσεις.</p><button class="btn primary" id="h_man">Άνοιγμα οδηγού χρήσης</button></div>
 <div class="card"><h2>Σχετικά</h2><p style="margin:0 0 6px"><b>${esc(S.app_name)}</b> • έκδοση ${esc(S.version)}</p><p class="small muted" style="margin:0 0 10px">${esc(S.author)}</p>
  <p class="small" style="margin:0">Λειτουργεί τοπικά στον υπολογιστή, χωρίς σύνδεση στο Internet. Τα δεδομένα δεν αποστέλλονται πουθενά.</p><div class="row" style="margin-top:10px"><button class="btn small" id="h_upd">Έλεγχος για νέα έκδοση</button></div></div>
 <div class="card"><h2>Φάκελοι</h2><div class="row"><button class="btn small" data-o="data">Δεδομένα</button><button class="btn small" data-o="backups">Αντίγραφα</button><button class="btn small" data-o="exports">Εξαγωγές</button><button class="btn small" data-o="app">Εφαρμογή</button></div><p class="small muted" style="margin:10px 0 0">${esc(S.data.root)}</p></div>
 <div class="card"><h2>Συντομεύσεις</h2><p class="small" style="margin:0;line-height:1.9"><kbd>Ctrl</kbd>+<kbd>N</kbd> νέα δράση • <kbd>Ctrl</kbd>+<kbd>F</kbd> αναζήτηση δράσεων • <kbd>Ctrl</kbd>+<kbd>S</kbd> αποθήκευση φόρμας • <kbd>Esc</kbd> κλείσιμο παραθύρου διαλόγου • Διπλό κλικ σε δράση: επεξεργασία • Διπλό κλικ σε ημέρα του μήνα: νέα δράση</p></div>
 <div class="card" style="grid-column:1/-1"><h2>Άδεια χρήσης και πνευματικά δικαιώματα</h2><p class="small" style="margin:0">Η εφαρμογή διατίθεται ως εκπαιδευτικό εργαλείο για σχολική χρήση. Επιτρέπεται η δωρεάν χρήση και διανομή σε σχολεία και εκπαιδευτικούς, χωρίς εμπορική εκμετάλλευση, με διατήρηση της αναφοράς δημιουργίας.<br>Αρχική ιδέα – επιμέλεια: Σταμάτης Κοκολόγος. Υλοποίηση: Σταμάτης Κοκολόγος, με αξιοποίηση εργαλείων τεχνητής νοημοσύνης.<br>Τα δεδομένα ανήκουν στη σχολική μονάδα που τα καταχωρίζει· ο/η χρήστης έχει την ευθύνη τήρησης αντιγράφων ασφαλείας σύμφωνα με τις οδηγίες της σχολικής μονάδας.</p></div></div></div>`;
 $('#h_man').onclick=()=>window.open('/manual','_blank','width=1000,height=860');$('#h_upd').onclick=checkUpdate;$$('[data-o]').forEach(b=>b.onclick=()=>call('open',{what:b.dataset.o}));}

/* ================================================================ γενικά */
document.addEventListener('keydown',e=>{if($('#dialog').open||$('#dialog2').open)return;
 if(e.ctrlKey&&(e.key==='n'||e.key==='ν')){e.preventDefault();actionForm(null);}
 if(e.ctrlKey&&(e.key==='f'||e.key==='φ')&&page==='actions'){e.preventDefault();$('#a_search')?.focus();}});
let dragN=0;document.addEventListener('dragenter',e=>{if([...e.dataTransfer.types].includes('Files')){dragN++;document.body.classList.add('filedrag');}});
document.addEventListener('dragleave',()=>{if(--dragN<=0){dragN=0;document.body.classList.remove('filedrag');}});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();dragN=0;document.body.classList.remove('filedrag');let f=e.dataTransfer.files[0];if(f)importFile(f);});
$('#exit').onclick=async()=>{if(await confirmBox('Κλείσιμο της εφαρμογής;','Έξοδος')){try{await api('shutdown');}catch(e){}document.body.innerHTML='<div style="display:grid;place-items:center;height:100vh;font:16px Segoe UI;color:#2F6F73">Η εφαρμογή έκλεισε. Μπορείτε να κλείσετε αυτό το παράθυρο.</div>';setTimeout(()=>window.close(),300);}};
$('#newver').onclick=()=>S.update&&showUpdate(S.update);
window.addEventListener('pagehide',()=>navigator.sendBeacon('/api/bye?t='+encodeURIComponent(token)));
setInterval(()=>api('ping').catch(()=>{}),60000);
(async()=>{try{await refreshState();}catch(e){$('#content').innerHTML=`<div class="note bad">${esc(e.message)}</div>`;return;}
 if(!ui.filters.school_year||(ui.filters.school_year!=='Όλα'&&!S.school_years.includes(ui.filters.school_year)))ui.filters.school_year=S.current_school_year;
 if(S.first_run)page='home';await render();if(S.update)toast('Διαθέσιμη νέα έκδοση '+S.update.version+'. Πατήστε «Νέα έκδοση» κάτω αριστερά.');})();
</script>
